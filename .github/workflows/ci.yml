name: CI - Restaurante

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Compilar y ejecutar pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: restaurante_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d restaurante_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_PROFILES_ACTIVE: test
      TEST_DB_URL: jdbc:postgresql://localhost:5432/restaurante_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres_ci

    steps:
      - name: Descargar el código
        uses: actions/checkout@v6

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar, probar y empaquetar
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Guardar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: target/surefire-reports/
          if-no-files-found: warn

      - name: Guardar el JAR
        uses: actions/upload-artifact@v4
        with:
          name: restaurante-jar
          path: target/*.jar
          if-no-files-found: error