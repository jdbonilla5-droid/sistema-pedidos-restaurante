spring.application.name=restaurante

# H2 en ARCHIVO: los datos sobreviven al reiniciar (persistencia real)
spring.datasource.url=jdbc:h2:file:./data/restaurante;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola de la BD: http://localhost:8080/h2-console
spring.h2.console.enabled=true
